[package]
name = "musql"
version = "0.7.1"
description = "MySQL client with optional SSH bastion"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
mysql = { version = "28", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
rfd = "0.17"
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native"] }
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
encoding_rs = "0.8"
bollard = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }

[features]
default = ["self-updater", "docker"]
self-updater = ["tauri-plugin-updater"]
docker = ["bollard", "futures-util"]

[profile.release]
codegen-units = 1
lto = true
strip = true
