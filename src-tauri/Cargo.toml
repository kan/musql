[package]
name = "musql"
version = "0.8.0"
description = "MySQL client with optional SSH bastion"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
mysql = { version = "28", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
rfd = "0.17"
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native"] }
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
encoding_rs = "0.8"
bollard = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }

# クリックで戻れるデスクトップ通知（#113、`src/toast.rs`）。
# - tauri-winrt-notification は tauri-plugin-notification 経由（notify-rust → これ）で
#   既に依存ツリーにいるので、直接依存へ上げてもビルドは増えない。プラグインを使わない
#   のは、あちらに desktop のクリックを受ける口が無いため
# - windows はスタートメニューのショートカットに AUMID を書くのに使う。tauri が引く版と
#   同じ 0.62 に揃えてある
tauri-winrt-notification = "0.7"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # パッケージ化されているか（Store 版か）の判定
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    # PROPVARIANT の手組み（VT_LPWSTR）
    "Win32_System_Com_StructuredStorage",
    # 名前付き mutex（ほかに muSQL が動いているかの判定。#126）
    "Win32_System_Threading",
    "Win32_System_Variant",
    # IShellLinkW / IPropertyStore
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

# 文字列まわりの無駄を常時検査する（#116）。`just clippy` は `-D warnings` なので、
# ここの warn は CI ではエラーになる。
[lints.clippy]
# `&str` に `to_string()` を呼ばない。生成コードは `to_owned()` と同じで速さは変わらないが、
# 綴りが混ざると「どちらが安いのか」を毎回考えることになる
str_to_string = "warn"
# `&&T`（T: Display）の `to_string()`。`Display` の blanket impl を通るので、memcpy 1 回では
# 済まず `fmt::Formatter` を回る
inefficient_to_string = "warn"
# 所有している値への `to_vec()` / `to_owned()`
implicit_clone = "warn"
# `s.push_str(&format!(…))`（`write!` なら中間の String を作らない）
format_push_string = "warn"
# `replace("'", …)` のような 1 文字の文字列パターン
single_char_pattern = "warn"

[features]
default = ["self-updater", "docker"]
self-updater = ["tauri-plugin-updater"]
docker = ["bollard", "futures-util"]

[profile.release]
codegen-units = 1
lto = true
strip = true
