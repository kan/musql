[package]
name = "musql"
version = "0.3.0"
description = "MySQL client with optional SSH bastion"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
mysql = { version = "27", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native"] }
russh = { version = "0.57", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
tauri-plugin-updater = { version = "2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[features]
default = ["self-updater"]
self-updater = ["tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
strip = true
