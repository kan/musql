[package]
name = "musql"
version = "0.2.0"
description = "MySQL client with optional SSH bastion"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
mysql = { version = "26", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native"] }
russh = "0.50"
tokio = { version = "1", features = ["net", "io-util", "time"] }
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
