version: 2
updates:
  # 更新は ecosystem ごとに 1 つの PR にまとめる。cargo の PR は全部が同じ Cargo.lock を
  # 触るので、個別に出すと 1 件取り込むたびに残りが衝突して作り直しになる。
  #
  # cooldown: 公開から一定の日数が経った版だけを取り込む。問題のある版や、乗っ取られて
  # 公開された版は、たいてい数日のうちに取り下げられるため。効くのはバージョン更新だけで、
  # セキュリティ更新（Dependabot alerts 由来の PR）は対象外なので遅れない。
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      cargo:
        patterns:
          - "*"
  # CI（release.yml / screenshots.yml）が使う Tauri CLI（kan/tagpr-scripts#9）。版と integrity を
  # tools/tauri-cli/package-lock.json で固定し、ここで上げる
  - package-ecosystem: npm
    directory: /tools/tauri-cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      tauri-cli:
        patterns:
          - "*"
  # github-actions は semver 別の日数に対応していないので default-days だけ。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # ignore は groups より先に効く（無視した依存はグループの PR にも入らない）
    ignore:
      # tagpr.yml が呼ぶ kan/tagpr-scripts の共通の workflow の SHA は、
      # scripts/tagpr/ の subtree と揃える。subtree pull と同じ PR でだけ上げ、
      # Dependabot には上げさせない（tagpr-scripts の README「The tagpr workflow」）
      - dependency-name: "kan/tagpr-scripts*"
    groups:
      github-actions:
        patterns:
          - "*"
