name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 週次 (毎週月曜 00:00 UTC): コミットがない期間の新規 RUSTSEC を検知する
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  check:
    # スケジュール実行では audit のみ回す (Windows ビルドは push/PR 時だけ)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

  lint-ui:
    # 静的 UI (ui/*.js) の Biome lint。スケジュール実行では回さない
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.4.10
      - name: Biome lint
        run: biome lint --error-on-warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          file: src-tauri/Cargo.lock
          # 起票は無効。この action は権限があると push/schedule 毎に warning (unmaintained/
          # yanked 等) まで issue 化して大量起票するため。検知は run の成否 (脆弱性で失敗) で担保。
          createIssues: false
          # RUSTSEC-2026-0194 / -0195: quick-xml <0.41 DoS. 推移依存 plist(<=1.9.0)→quick-xml
          # がまだ >=0.41 に対応しておらず、更新経路なし。ビルド/plist 経由でランタイムに
          # 信頼できない XML を渡さないため実リスクは低い。上流が quick-xml >=0.41 を採用したら削除。
          # 形式はカンマ区切り (actions-rust-lang/audit の仕様)。
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0194,RUSTSEC-2026-0195
