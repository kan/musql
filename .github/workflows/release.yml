name: Release

# 通常は tagpr のワークフローがリリース PR のマージ後に呼ぶ（`workflow_call`、#149）。
# tagpr は GITHUB_TOKEN でタグを打つので、タグの push では起動しない（`push.tags` は置かない）。
# 打ってあるタグで丸ごとやり直すとき・手でタグを打ち直したときは `workflow_dispatch` で起動する。
on:
  workflow_call:
    inputs:
      tag:
        description: リリースするタグ（vX.Y.Z）
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: リリースするタグ（vX.Y.Z）
        type: string
        required: true

# 同じタグの実行を並べない（tagpr からの呼び出しと手での再実行が重なると、draft ジョブが互いの
# ドラフトを消し合う）。止めもしない（ビルドの途中で止めると、成果物の欠けたドラフトが残る）
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # タグはここから取る。`github.ref_name` は呼び出し元のブランチ（main）なので使わない
  TAG: ${{ inputs.tag }}
  # 両ジョブが使う Tauri CLI（npm のビルド済みのもの）の版。完全な版で固定する（#138）。
  # 固定しないと、タグを打った時点の最新が検証されないまま走り、attestation の付く
  # 成果物を作る。2 つのジョブで版がずれることも防ぐ。dependabot は上げないので、
  # tauri クレート（src-tauri/Cargo.lock）を上げたときに手で合わせる。
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  # ドラフトは先に 1 つだけ作り、build にその ID と本文を渡す（#149）。build-store はドラフトに
  # 触らず、publish-store がタグ名でこのドラフトへ足す。
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
      notes: ${{ steps.draft.outputs.notes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Create the draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 本文は CHANGELOG の節から作る。build が latest.json の notes にも入れる。
          # タグが vX.Y.Z の形でないとき、tauri.conf.json の版（成果物の名前はこれから付く）と
          # 食い違うとき、節が無いか空のときは、スクリプトが止める。
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release-notes.mjs "$TAG" > "$notes"
          # 同じタグのドラフトが残っていたら（再実行やタグの打ち直し）消してから作り直す。
          # ドラフトを常に 1 つにしておくと、releaseId で上げる build と、タグ名で上げる
          # publish-store が同じドラフトに当たる。公開済みなら止める。
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          while read -r old_id is_draft; do
            [ -n "$old_id" ] || continue
            if [ "$is_draft" != true ]; then
              echo "release $TAG is already published" >&2
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$old_id"
          done <<< "$releases"
          # ドラフトで作る (#111)。公開は、アセットを確かめてから手で行う
          # (`.claude/skills/release/SKILL.md`)。ドラフトは releases/latest にならないので、
          # 公開するまでセルフアップデータには配られない。
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "muSQL $TAG" --notes-file "$notes"
          id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<MUSQL_NOTES_EOF"
            cat "$notes"
            echo "MUSQL_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    runs-on: windows-latest
    permissions:
      contents: write
      # Artifact attestations（#130）。署名は Actions の OIDC トークンで Sigstore の
      # 短命証明書を取って行うので、鍵の secret は増えない。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      # rust-cache は使わない（#138）。タグの run が読めるのはデフォルトブランチの
      # キャッシュだけで、前回のタグが保存した分は読めない。main の CI のキャッシュは
      # キー（ジョブ）もプロファイル（dev と release）も違うので当たらない。保存の
      # 時間だけがかかる。

      - name: Build and release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 指定しないと、tauri-action は npm の @tauri-apps/cli@v2 の最新を入れる。
          tauriScript: npx --yes ${{ env.TAURI_CLI }}
          # draft が作ったドラフトへ上げる（自分ではリリースを作らない）
          releaseId: ${{ needs.draft.outputs.release-id }}
          # latest.json の notes になる（tauri-action は releaseId があっても releaseBody を使う）。
          # 公開後は差し替えられないので、ドラフトの本文と同じ CHANGELOG の節を渡す
          releaseBody: ${{ needs.draft.outputs.notes }}
          uploadUpdaterJson: true
          # latest.json の `windows-x86_64` を MSI ではなく NSIS（setup.exe）に向ける（#147。
          # pike と同じ）。アプリは `windows-x86_64-nsis` を指定して取りに来るので
          # （main.rs の `fetch_update`）、これは種別を指定しない古い版や他のクライアント向け。
          updaterJsonPreferNsis: true

      # 手でダウンロードするインストーラに来歴の証明を付ける（#130）。グロブは拡張子の
      # 末尾まで書く。bundle/ には配布しない .msi.zip / .nsis.zip と各 .sig も並んでいる。
      # .sig と latest.json は対象外（updater の経路は minisign の検証で足りている）。
      - name: Attest the installers
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-store:
    # build と並列に走らせる（#138）。Release には触らず、ファイルを artifact で
    # publish-store へ渡す。ドラフトを作るのは draft ジョブだけにしておく。
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      # rust-cache を使わない理由は build と同じ。
      # Tauri CLI は npm のビルド済みのものを使う（#138。`cargo install tauri-cli` は
      # 毎回ソースからコンパイルして 7 分かかる）。版は先頭の env の TAURI_CLI。
      - name: Build Store variant
        run: npx --yes ${{ env.TAURI_CLI }} build --config tauri.store.conf.json -- --no-default-features --features docker
        working-directory: src-tauri

      - name: Rename Store EXE
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/musql.exe" "muSQL-store-x64.exe"

      - name: Derive MSIX version
        id: msix-version
        shell: pwsh
        run: |
          $tag = $env:TAG -replace '^v',''
          $parts = $tag.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $ver = $parts[0..3] -join '.'
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        run: |
          .\store\build-msix.ps1 `
            -Version "${{ steps.msix-version.outputs.version }}" `
            -ExePath  "src-tauri\target\release\musql.exe" `
            -OutputPath "muSQL-store-x64.msix"

      # 成果物への最後の書き換え（MSIX の生成）のあとに置く（#130）。検証はダイジェストで
      # 行うので、Releases から落としたファイルなら通る。Store が配る MSIX は Microsoft が
      # 署名し直すので対象外。
      - name: Attest the Store artifacts
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            muSQL-store-x64.exe
            muSQL-store-x64.msix

      # attestation はダイジェストで検証するので、artifact を経由しても通る。
      - name: Hand the Store artifacts to publish-store
        uses: actions/upload-artifact@v7.0.2
        with:
          name: store
          path: |
            muSQL-store-x64.exe
            muSQL-store-x64.msix
          if-no-files-found: error
          # build の失敗を直して「Re-run failed jobs」で publish-store だけを
          # 走らせ直せるように、数日は残す。
          retention-days: 7

  publish-store:
    # draft が作ったドラフトに、Store のファイルを足す。build を待つのは、build が落ちた
    # ドラフトへ Store の分だけが載るのを避けるため。
    needs: [build, build-store]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: store

      # gh はタグ名からドラフトの Release も引ける。Release が無ければ失敗する
      # (新しく作らない) ので、draft が作ったドラフト以外へ上げてしまうことが無い
      # (同じタグのドラフトは draft ジョブが 1 つにしてある)。
      - name: Upload to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:TAG" `
            muSQL-store-x64.exe muSQL-store-x64.msix `
            --clobber --repo "$env:GITHUB_REPOSITORY"
