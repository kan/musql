name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "muSQL ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          # ドラフトで作る (#111)。公開は、アセットを確認してリリースノートを書いたあとに
          # 手で行う (`.claude/skills/release/SKILL.md`)。ドラフトは releases/latest に
          # ならないので、公開するまでセルフアップデータには配られない。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

  build-store:
    # build のあとに走らせる。ドラフトの Release を作るのは build の tauri-action で、
    # こちらはそこへアセットを足すだけ。並列だと、先に終わった側が Release を作ることに
    # なり、どちらが作るかで公開状態が変わってしまう。
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: store

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Store variant
        run: cargo tauri build --config tauri.store.conf.json -- --no-default-features --features docker
        working-directory: src-tauri

      - name: Rename Store EXE
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/musql.exe" "muSQL-store-x64.exe"

      - name: Derive MSIX version
        id: msix-version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $parts = $tag.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $ver = $parts[0..3] -join '.'
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        run: |
          .\store\build-msix.ps1 `
            -Version "${{ steps.msix-version.outputs.version }}" `
            -ExePath  "src-tauri\target\release\musql.exe" `
            -OutputPath "muSQL-store-x64.msix"

      # gh はタグ名からドラフトの Release も引ける。Release が無ければ失敗する
      # (新しく作らない) ので、build が作ったドラフト以外へ上げてしまうことが無い。
      - name: Upload to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            muSQL-store-x64.exe muSQL-store-x64.msix `
            --clobber --repo "$env:GITHUB_REPOSITORY"
