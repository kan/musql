name: Release

on:
  push:
    tags:
      - "v*"

env:
  # 両ジョブが使う Tauri CLI（npm のビルド済みのもの）の版。完全な版で固定する（#138）。
  # 固定しないと、タグを打った時点の最新が検証されないまま走り、attestation の付く
  # 成果物を作る。2 つのジョブで版がずれることも防ぐ。dependabot は上げないので、
  # tauri クレート（src-tauri/Cargo.lock）を上げたときに手で合わせる。
  TAURI_CLI: "@tauri-apps/cli@2.12.3"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      # Artifact attestations（#130）。署名は Actions の OIDC トークンで Sigstore の
      # 短命証明書を取って行うので、鍵の secret は増えない。
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      # rust-cache は使わない（#138）。タグの run が読めるのはデフォルトブランチの
      # キャッシュだけで、前回のタグが保存した分は読めない。main の CI のキャッシュは
      # キー（ジョブ）もプロファイル（dev と release）も違うので当たらない。保存の
      # 時間だけがかかる。

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 指定しないと、tauri-action は npm の @tauri-apps/cli@v2 の最新を入れる。
          tauriScript: npx --yes ${{ env.TAURI_CLI }}
          tagName: ${{ github.ref_name }}
          releaseName: "muSQL ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          # ドラフトで作る (#111)。公開は、アセットを確認してリリースノートを書いたあとに
          # 手で行う (`.claude/skills/release/SKILL.md`)。ドラフトは releases/latest に
          # ならないので、公開するまでセルフアップデータには配られない。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

      # 手でダウンロードするインストーラに来歴の証明を付ける（#130）。グロブは拡張子の
      # 末尾まで書く。bundle/ には配布しない .msi.zip / .nsis.zip と各 .sig も並んでいる。
      # .sig と latest.json は対象外（updater の経路は minisign の検証で足りている）。
      - name: Attest the installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-store:
    # build と並列に走らせる（#138）。Release には触らず、ファイルを artifact で
    # publish-store へ渡す。ドラフトの Release を作るのは build の tauri-action だけに
    # しておく（両方が作りに行くと、先に終わった側が作ることになり、どちらが作るかで
    # 公開状態が変わってしまう）。
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      # rust-cache を使わない理由は build と同じ。
      # Tauri CLI は npm のビルド済みのものを使う（#138。`cargo install tauri-cli` は
      # 毎回ソースからコンパイルして 7 分かかる）。版は先頭の env の TAURI_CLI。
      - name: Build Store variant
        run: npx --yes ${{ env.TAURI_CLI }} build --config tauri.store.conf.json -- --no-default-features --features docker
        working-directory: src-tauri

      - name: Rename Store EXE
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/musql.exe" "muSQL-store-x64.exe"

      - name: Derive MSIX version
        id: msix-version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $parts = $tag.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $ver = $parts[0..3] -join '.'
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        run: |
          .\store\build-msix.ps1 `
            -Version "${{ steps.msix-version.outputs.version }}" `
            -ExePath  "src-tauri\target\release\musql.exe" `
            -OutputPath "muSQL-store-x64.msix"

      # 成果物への最後の書き換え（MSIX の生成）のあとに置く（#130）。検証はダイジェストで
      # 行うので、Releases から落としたファイルなら通る。Store が配る MSIX は Microsoft が
      # 署名し直すので対象外。
      - name: Attest the Store artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            muSQL-store-x64.exe
            muSQL-store-x64.msix

      # attestation はダイジェストで検証するので、artifact を経由しても通る。
      - name: Hand the Store artifacts to publish-store
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store
          path: |
            muSQL-store-x64.exe
            muSQL-store-x64.msix
          if-no-files-found: error
          # build の失敗を直して「Re-run failed jobs」で publish-store だけを
          # 走らせ直せるように、数日は残す。
          retention-days: 7

  publish-store:
    # build がドラフトの Release を作ったあとに、Store のファイルをそこへ足す。
    needs: [build, build-store]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store

      # gh はタグ名からドラフトの Release も引ける。Release が無ければ失敗する
      # (新しく作らない) ので、build が作ったドラフト以外へ上げてしまうことが無い。
      - name: Upload to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            muSQL-store-x64.exe muSQL-store-x64.msix `
            --clobber --repo "$env:GITHUB_REPOSITORY"
