name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "muSQL ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

  build-store:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: store

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Store variant
        run: cargo tauri build --config tauri.store.conf.json -- --no-default-features --features docker
        working-directory: src-tauri

      - name: Rename Store EXE
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/musql.exe" "muSQL-store-x64.exe"

      - name: Derive MSIX version
        id: msix-version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $parts = $tag.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $ver = $parts[0..3] -join '.'
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        run: |
          .\store\build-msix.ps1 `
            -Version "${{ steps.msix-version.outputs.version }}" `
            -ExePath  "src-tauri\target\release\musql.exe" `
            -OutputPath "muSQL-store-x64.msix"

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            muSQL-store-x64.exe
            muSQL-store-x64.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
