name: Screenshots

# マニュアルのスクリーンショットを Windows ランナーで撮る（`just screenshots`、仕組みは
# `src-tauri/src/screenshots.rs`）。リリースの前に `release` スキルの手順から、**リリース PR の
# ブランチ（`tagpr-from-v<前回の版>`）を ref にして**起動する（#149）。
#
# `commit: true`（既定）なら `just screenshots-sync` で `docs/manual/img/` へ写し、差分があれば
# そのブランチへコミットを 1 つ積む。tagpr はリリース PR を作り直すときもこのコミットを引き継ぐ。
# 画像の差分はリリース PR の画面で見てからマージする。`commit: false` なら撮った画像を
# アーティファクトに上げるだけ（どの ref からでも起動できる）。
#
# **書き込みの権限はコミットするジョブだけに付ける。** 撮影のジョブは依存（クレートの build.rs）と
# アプリを動かすので、読み取りの権限だけで走らせ、写した画像をアーティファクトで渡す。
#
# 手元の撮影（日本語の Windows、拡大率 150%）と同じ絵にするための前提:
#
# - 表示倍率 1.5 … ランナーの画面は 100% 固定。撮影用の設定（`tauri.screenshots.conf.json`）が
#   WebView2 に `--force-device-scale-factor=1.5` を渡し、撮影がウィンドウの大きさを合わせる
# - フォント … UI は "Segoe UI", "Yu Gothic UI" を名指ししていて、どちらもランナーに入っている
# - タイムゾーン … 日本時間にする（画面とフィクスチャの日時を手元とそろえる）
# - データ … docs/manual/fixtures の MySQL。Windows のランナーでは Linux のコンテナが動かないので、
#   Windows 版の MySQL を入れて init SQL を流す
on:
  workflow_dispatch:
    inputs:
      commit:
        description: docs/manual/img へ写してリリース PR のブランチへコミットする
        type: boolean
        default: true

permissions:
  contents: read

# 続けて起動したら前の run を止める（同じブランチへ画像のコミットを 2 つ積みうる）
concurrency:
  group: screenshots
  cancel-in-progress: true

env:
  # release.yml の TAURI_CLI と同じ版にする（dependabot は上げない）
  TAURI_CLI: "@tauri-apps/cli@2.12.4"
  MYSQL_VERSION: 8.0.43

jobs:
  capture:
    name: Capture screenshots
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # コミット先はリリース PR のブランチだけにする（main はリリース PR のマージまで前の版のまま）
      - name: Check inputs
        if: inputs.commit && !startsWith(github.ref, 'refs/heads/tagpr-from-')
        shell: bash
        run: |
          echo "::error::commit はリリース PR のブランチ（tagpr-from-v<前回の版>）から起動する"
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # その版のタグが既にあるなら、マージ済みのブランチを撮ろうとしている
      - name: Check the version is not released yet
        if: inputs.commit
        shell: bash
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version のタグが既にある（リリース済みのブランチは撮らない）"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: "src-tauri -> target/screenshots"
          # ci.yml の check と分ける（あちらは target/ を既定の feature で作る）
          key: screenshots
          # 撮影のステップが落ちても、ビルドの分は次の実行で使えるように残す
          cache-on-failure: true

      - uses: extractions/setup-just@v4.0.0

      - name: Set time zone to JST
        run: tzutil /s "Tokyo Standard Time"

      # fixtures/docker-compose.yml と同じ構成（文字コード、照合順序、demo ユーザー）にする
      - name: Start MySQL with the demo databases
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
          Invoke-WebRequest "https://cdn.mysql.com/archives/mysql-8.0/mysql-$env:MYSQL_VERSION-winx64.zip" -OutFile $zip
          # Expand-Archive は数百 MB の zip で数分かかる。Windows の tar（bsdtar）は zip も展開できる
          tar -xf $zip -C $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'extracting MySQL failed' }
          $bin = Join-Path $env:RUNNER_TEMP "mysql-$env:MYSQL_VERSION-winx64\bin"
          $data = Join-Path $env:RUNNER_TEMP 'mysql-data'
          & "$bin\mysqld.exe" --initialize-insecure "--datadir=$data"
          if ($LASTEXITCODE) { throw 'mysqld --initialize-insecure failed' }
          Start-Process "$bin\mysqld.exe" -ArgumentList "--datadir=$data", '--port=3306',
            '--character-set-server=utf8mb4', '--collation-server=utf8mb4_ja_0900_as_cs'
          for ($i = 0; $i -lt 60; $i++) {
            & "$bin\mysqladmin.exe" -uroot ping 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($LASTEXITCODE) { throw 'MySQL did not start' }
          & "$bin\mysql.exe" -uroot -e "CREATE DATABASE ec_demo; CREATE USER 'demo'@'%' IDENTIFIED BY 'demo1234'; GRANT ALL PRIVILEGES ON ec_demo.* TO 'demo'@'%';"
          if ($LASTEXITCODE) { throw 'creating the demo user failed' }
          foreach ($sql in Get-ChildItem docs/manual/fixtures/init/*.sql | Sort-Object Name) {
            $path = $sql.FullName -replace '\\', '/'
            & "$bin\mysql.exe" -uroot --default-character-set=utf8mb4 -e "source $path"
            if ($LASTEXITCODE) { throw "loading $($sql.Name) failed" }
          }

      - name: Build capture binary
        env:
          MUSQL_TAURI_CLI: npx --yes ${{ env.TAURI_CLI }}
        run: just screenshots-build

      - name: Capture
        run: just screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn

      # 撮れなかった画像があれば落ちる（古い画像が残ったまま、差分にも出ないため）
      - name: Sync into docs/manual/img
        if: inputs.commit
        run: just screenshots-sync

      - name: Hand the images to the commit job
        if: inputs.commit
        uses: actions/upload-artifact@v7.0.2
        with:
          name: manual-img
          path: docs/manual/img/*.png
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit to the release pull request
    needs: capture
    if: inputs.commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 撮影したコミットの上に積む。撮影中に tagpr がブランチを作り直していたら、push が
      # fast-forward にならずに落ちる（古いツリーで撮った画像を新しいブランチに載せない）。
      # そのときは起動し直す
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v8.0.2
        with:
          name: manual-img
          path: docs/manual/img/

      # 差分が無ければ何もしない。版は bump 済みの tauri.conf.json から取る
      - name: Commit and push
        run: |
          git add docs/manual/img
          if git diff --cached --quiet; then
            echo "画像に差分が無い"
            exit 0
          fi
          version=$(jq -r .version src-tauri/tauri.conf.json)
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "v$version でマニュアルのスクリーンショットを撮り直す"
          git push origin "HEAD:${GITHUB_REF}"
