name: tagpr

# リリース PR を作り、マージされたらタグを打ってリリースを走らせる（#149）。設定は `.tagpr`、
# 手順は `release` スキル、設計の理由は CLAUDE.md の「リリース PR（tagpr）」。
#
# - main が進むたびに、版・Cargo.lock・CHANGELOG の見出し・ライセンス一覧を載せたリリース PR
#   （ブランチ `tagpr-from-v<前回の版>`）を作り直す（`scripts/release-prepare.mjs`）
# - リリース PR がマージされると、tagpr がタグを打ち、同じ run の `release` ジョブが
#   Release ワークフローをそのタグで起動する（`workflow_dispatch`）。**GITHUB_TOKEN で打った
#   タグでは `on.push.tags` が起動しない**ので、タグの push には頼らない
# - `workflow_dispatch` は、リリース PR にラベル（`tagpr:minor`）を付けたあとの作り直し用
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tagpr:
    name: Prepare the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tagpr どうしは並べない（同じリリース PR のブランチを作り直し合う）。止めもしない
    # （タグを打った直後に止めると、成果物の無いタグが残る）。release ジョブは含めないので、
    # ビルドの最中に来た push もリリース PR の作り直しを待たされない。
    #
    # それでも GitHub は待っている run を 1 つしか持たない。リリース PR のマージの run が
    # 待っている間に push が来ると、その run は cancelled になりタグが打たれない。後の push の
    # run は `scripts/tagpr/release-prepare.mjs` の検査（タグより新しい版の節がある）で赤になるので、
    # マージコミットの run を再実行する（release スキル）
    concurrency:
      group: tagpr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # release-prepare.mjs（と credits.mjs）を動かす。npm の依存は無い
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      # Rust はランナーに入っている stable を使う。呼ぶのは `cargo update --workspace` と
      # `cargo metadata` だけで、build.rs は走らない。**このジョブは書き込みの権限を持つので、
      # musql と依存のコードを動かさない**（ビルドやテストを足さない）

      - id: tagpr
        uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # **GITHUB_TOKEN で push したタグでは `push: tags` が起動しない。** `workflow_dispatch` は
  # その例外なので、タグを ref にして release.yml を起動する（#152）。`workflow_call` で同じ
  # run から呼ばないのは、run の ref が main になり、attestation の source ref もそれを名乗るため
  release:
    name: Start the release
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # workflow_dispatch
    steps:
      - name: Dispatch release.yml on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
