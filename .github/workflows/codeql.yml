name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 週次 (毎週月曜 01:00 UTC): コミットがない期間もクエリの更新分を検査する
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust は Windows 専用コード (cfg(windows)) が多いので、実際のターゲットで解析する。
          - language: rust
            os: windows-latest
          - language: javascript-typescript
            os: ubuntu-latest
          - language: actions
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          # 3 言語ともビルド不要 (Rust も build-mode: none で解析できる)。
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:${{ matrix.language }}
