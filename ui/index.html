<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muSQL</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=9" />
  </head>
  <body data-theme-toggle>
    <main>
      <div class="app-header">
        <img src="./icon.svg" class="app-logo" alt="" width="36" height="36" />
        <h1>muSQL</h1>
        <span id="app-version" class="app-version"></span>
        <button id="menu-btn" class="ghost menu-btn" style="margin-left:auto;"></button>
      </div>

      <div class="panel-header">
        <div class="panel-header-buttons">
          <button id="docker-btn" class="ghost" style="display:none;" data-i18n-title="docker_btn_title"></button>
          <button id="group-new" class="ghost"></button>
          <button id="profile-new"></button>
        </div>
      </div>
      <section id="list-panel" class="panel">
        <div id="filter-wrapper" class="filter-input-wrapper">
          <input id="filter-input" type="text" data-i18n-placeholder="filter_placeholder" placeholder="接続先を検索..." autocomplete="off" />
        </div>
        <div id="tag-filter-bar" class="tag-filter-bar"></div>
        <div id="profile-tree" class="tree"></div>
      </section>

      <div id="context-menu" class="context-menu hidden"></div>

      <!-- Docker container list modal -->
      <div id="docker-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <div class="modal-heading-row">
            <h2 id="docker-modal-heading"></h2>
            <button type="button" class="help-btn" data-manual="docker.md" data-i18n-title="help_open_manual">?</button>
          </div>
          <div id="docker-list" class="db-list"></div>
          <p id="docker-modal-status" class="modal-status"></p>
          <div style="margin-top:12px;text-align:right;">
            <button id="docker-modal-close" class="ghost" data-i18n="docker_close">Close</button>
          </div>
        </div>
      </div>

      <!-- Docker credentials modal -->
      <div id="docker-cred-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <div class="modal-heading-row">
            <h2 id="docker-cred-heading" data-i18n="docker_connect_credentials"></h2>
            <button type="button" class="help-btn" data-manual="docker.md#使い方" data-i18n-title="help_open_manual">?</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <label>
              <span data-i18n="user">User</span>
              <input id="docker-cred-user" type="text" value="root" autocomplete="off" />
            </label>
            <label>
              <span data-i18n="password">Password</span>
              <input id="docker-cred-password" type="password" autocomplete="off" />
            </label>
            <label>
              <span data-i18n="ssl_mode">SSL Mode</span>
              <select id="docker-cred-ssl">
                <option value="DISABLED">DISABLED</option>
                <option value="REQUIRED">REQUIRED</option>
                <option value="VERIFY_CA">VERIFY_CA</option>
                <option value="VERIFY_IDENTITY">VERIFY_IDENTITY</option>
              </select>
            </label>
          </div>
          <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end;">
            <button id="docker-cred-cancel" class="ghost" data-i18n="cancel">Cancel</button>
            <button id="docker-cred-ok" data-i18n="connect">Connect</button>
          </div>
        </div>
      </div>

    </main>

    <script src="./icons.js"></script>
    <script src="./i18n.js"></script>
    <script src="./theme.js"></script>
    <script src="./manual.js"></script>
    <script src="./app.js?v=10"></script>
  </body>
</html>
