<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muSQL</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=5" />
  </head>
  <body>
    <main>
      <div class="app-header">
        <img src="./icon.svg" class="app-logo" alt="" width="36" height="36" />
        <h1>muSQL</h1>
      </div>

      <div class="panel-header">
        <h2>Connections</h2>
        <div class="panel-header-buttons">
          <button id="group-new" class="ghost">新規グループ</button>
          <button id="profile-new">新規</button>
        </div>
      </div>
      <section id="list-panel" class="panel">
        <input id="filter-input" type="text" placeholder="フィルター..." autocomplete="off" />
        <div id="tag-filter-bar" class="tag-filter-bar"></div>
        <div id="profile-tree" class="tree"></div>
      </section>

      <div id="context-menu" class="context-menu hidden"></div>

    </main>

    <script src="./app.js?v=5"></script>
  </body>
</html>
