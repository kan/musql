<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muSQL Redis</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=15" />
  </head>
  <body>
    <!-- Credential prompt modal (credential-prompt.js) -->
    <div id="pw-prompt-modal" class="modal-overlay hidden">
      <div class="modal-box" style="max-width:400px;">
        <div class="modal-heading-row">
          <h2 data-i18n="enter_credentials">Enter Credentials</h2>
          <button type="button" class="help-btn" data-manual="connections.md#パスワードの保存方針" data-i18n-title="help_open_manual">?</button>
        </div>
        <div id="pw-prompt-fields"></div>
        <p id="pw-prompt-error" class="modal-status"></p>
        <div class="actions actions-right" style="margin-top:16px;">
          <button id="pw-prompt-ok" class="success" data-i18n="connect">Connect</button>
          <button id="pw-prompt-cancel" class="ghost" data-i18n="cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Shown while connecting, and when the connection fails -->
    <div id="redis-status" class="redis-status"></div>

    <div id="explorer" class="explorer hidden">
      <!-- Sidebar: the keys -->
      <div class="sidebar">
        <div class="sidebar-header">
          <button type="button" id="redis-server" class="ghost sidebar-db-name redis-db-switch" data-i18n-title="redis_switch_db" title="Switch database"></button>
          <button id="redis-refresh-btn" class="ghost sidebar-btn" data-i18n-title="redis_refresh" title="Refresh"></button>
        </div>
        <div class="redis-filter">
          <input id="redis-pattern" data-i18n-placeholder="redis_pattern_placeholder" placeholder="Pattern (e.g. user:*)" />
        </div>
        <div id="redis-key-list" class="table-list"></div>
        <div class="redis-more">
          <button id="redis-more-btn" class="ghost hidden" data-i18n="redis_load_more">Load more</button>
        </div>
      </div>

      <!-- Main pane: the CLI tab and one tab per opened key -->
      <div class="main-pane">
        <div class="tab-bar">
          <div id="tab-bar-tabs" class="tab-bar-tabs"></div>
          <button type="button" class="help-btn" data-manual="redis.md" data-i18n-title="help_open_manual">?</button>
          <button id="menu-btn" class="ghost menu-btn sidebar-btn"></button>
        </div>
        <div id="tab-content" class="tab-content"></div>
      </div>
    </div>

    <!-- Context menu (context-menu.js): the DB switcher and the export menu -->
    <div id="context-menu" class="context-menu hidden"></div>

    <script src="./error-log.js"></script>
    <script src="./icons.js"></script>
    <script src="./i18n.js"></script>
    <script src="./theme.js"></script>
    <script src="./manual.js"></script>
    <script src="./result-table.js?v=2"></script>
    <script src="./credential-prompt.js?v=1"></script>
    <script src="./context-menu.js?v=1"></script>
    <script src="./export.js?v=1"></script>
    <script src="./redis.js?v=3"></script>
  </body>
</html>
