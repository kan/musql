<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muSQL Settings</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=7" />
  </head>
  <body>
    <main class="settings-main">
      <!-- Header with menu button -->
      <div class="settings-header-bar">
        <button id="menu-btn" class="ghost menu-btn" style="margin-left:auto;"></button>
      </div>
      <!-- Action bar -->
      <div class="settings-action-bar" style="justify-content:flex-end;">
        <button id="test-btn" class="info"></button>
        <button id="connect-btn" class="success"></button>
        <button id="profile-save"></button>
        <button id="profile-cancel" class="ghost"></button>
        <button id="profile-delete" class="danger"></button>
      </div>

      <!-- Single unified panel -->
      <section class="panel settings-panel">
        <!-- General section -->
        <h3 class="settings-section-heading" data-i18n="general">General</h3>
        <div class="grid">
          <label><span data-i18n="profile_name">Profile name</span> <input id="profile-name" data-i18n-placeholder="profile_name_placeholder" placeholder="e.g. prod/analytics" /></label>
          <label><span data-i18n="color">Color</span>
            <div class="color-select" id="color-select">
              <div class="color-select-btn" id="color-select-btn"></div>
              <div class="color-select-dropdown hidden" id="color-select-dropdown"></div>
            </div>
          </label>
        </div>
        <div class="tag-input-row" style="margin-top: 12px">
          <label><span data-i18n="tags">Tags</span>
            <div class="tag-input-wrapper">
              <div id="tag-chips" class="tag-chips"></div>
              <input id="tag-input" data-i18n-placeholder="add_tag_placeholder" placeholder="Add tag..." autocomplete="off" />
              <div id="tag-suggestions" class="tag-suggestions hidden"></div>
            </div>
          </label>
        </div>

        <hr class="settings-divider" />

        <!-- DB section -->
        <h3 class="settings-section-heading" data-i18n="mysql">DB Settings</h3>
        <div class="grid">
          <label><span data-i18n="db_engine">DB Engine</span>
            <select id="db-engine" disabled>
              <option value="mysql" selected>MySQL</option>
            </select>
          </label>
          <label><span data-i18n="host">Host</span> <input id="mysql-host" value="127.0.0.1" /></label>
          <label><span data-i18n="port">Port</span> <input id="mysql-port" type="number" value="3306" /></label>
          <label><span data-i18n="database">Database</span> <input id="mysql-db" data-i18n-placeholder="optional" placeholder="optional" /></label>
          <label><span data-i18n="user">User</span> <input id="mysql-user" value="root" /></label>
          <label><span data-i18n="password">Password</span>
            <div class="input-with-btn">
              <input id="mysql-pass" type="password" />
              <button type="button" id="mysql-pass-clear" class="browse-btn clear-pw-btn hidden" data-i18n-title="clear_password">&times;</button>
            </div>
            <label class="save-toggle"><input id="mysql-save-password" type="checkbox" checked /><span data-i18n="save_to_keyring">Save to keyring</span></label>
          </label>
          <label><span data-i18n="ssl_mode">SSL Mode</span>
            <select id="mysql-ssl-mode">
              <option value="DISABLED">DISABLED</option>
              <option value="REQUIRED">REQUIRED</option>
              <option value="VERIFY_CA">VERIFY_CA</option>
              <option value="VERIFY_IDENTITY">VERIFY_IDENTITY</option>
            </select>
          </label>
        </div>
        <div id="ca-cert-row" class="grid hidden" style="margin-top:10px">
          <label><span data-i18n="ca_certificate">CA Certificate</span>
            <div class="input-with-btn">
              <input id="mysql-ca-cert" placeholder="/path/to/ca-cert.pem" />
              <button type="button" id="mysql-ca-cert-browse" class="browse-btn">Browse...</button>
            </div>
          </label>
        </div>

        <hr class="settings-divider" />

        <!-- SSH section - header is a checkbox -->
        <label class="settings-section-heading settings-ssh-toggle">
          <input id="ssh-enabled" type="checkbox" />
          <span data-i18n="ssh_via">SSH</span>
        </label>
        <div id="ssh-fields" class="grid" style="margin-top:10px">
          <label><span data-i18n="ssh_auth_method">Auth Method</span>
            <select id="ssh-auth-method">
              <option value="key" data-i18n="ssh_auth_key">Public Key</option>
              <option value="password" data-i18n="ssh_auth_password">Password</option>
            </select>
          </label>
          <label><span data-i18n="host">Host</span> <input id="ssh-host" placeholder="bastion.example.com" /></label>
          <label><span data-i18n="port">Port</span> <input id="ssh-port" type="number" value="22" /></label>
          <label><span data-i18n="user">User</span> <input id="ssh-user" placeholder="ec2-user" /></label>
          <label id="ssh-key-row"><span data-i18n="identity_file">Private Key</span>
            <div class="input-with-btn">
              <input id="ssh-key" placeholder="~/.ssh/id_ed25519.pub" />
              <button type="button" id="ssh-key-browse" class="browse-btn">Browse...</button>
            </div>
          </label>
          <label id="ssh-passphrase-row"><span data-i18n="ssh_passphrase">Passphrase</span>
            <div class="input-with-btn">
              <input id="ssh-passphrase" type="password" />
              <button type="button" id="ssh-passphrase-clear" class="browse-btn clear-pw-btn hidden" data-i18n-title="clear_ssh_passphrase">&times;</button>
            </div>
            <label class="save-toggle"><input id="ssh-save-passphrase" type="checkbox" checked /><span data-i18n="save_to_keyring">Save to keyring</span></label>
          </label>
          <label id="ssh-password-row" class="hidden"><span data-i18n="ssh_password_label">Password</span>
            <div class="input-with-btn">
              <input id="ssh-password" type="password" />
              <button type="button" id="ssh-password-clear" class="browse-btn clear-pw-btn hidden" data-i18n-title="clear_ssh_password">&times;</button>
            </div>
            <label class="save-toggle"><input id="ssh-save-password" type="checkbox" checked /><span data-i18n="save_to_keyring">Save to keyring</span></label>
          </label>
          <div id="ssh-config-row" class="ssh-config-row"></div>
        </div>
      </section>

      <pre id="result" class="log" hidden></pre>
    </main>

    <script src="./icons.js"></script>
    <script src="./i18n.js"></script>
    <script src="./theme.js"></script>
    <script src="./settings.js?v=6"></script>
  </body>
</html>
