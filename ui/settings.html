<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muSQL Settings</title>
    <link rel="stylesheet" href="./style.css?v=3" />
  </head>
  <body>
    <main>
      <h1>Settings</h1>
      <p class="subtitle">Connection profile</p>

      <section class="panel">
        <h2>General</h2>
        <div class="grid">
          <label>Profile name <input id="profile-name" placeholder="e.g. prod/analytics" /></label>
        </div>
        <div class="color-picker-row" style="margin-top: 12px">
          <label>Color</label>
          <div id="color-palette" class="color-palette"></div>
        </div>
        <div class="tag-input-row" style="margin-top: 12px">
          <label>Tags
            <div class="tag-input-wrapper">
              <div id="tag-chips" class="tag-chips"></div>
              <input id="tag-input" placeholder="Add tag..." autocomplete="off" />
              <div id="tag-suggestions" class="tag-suggestions hidden"></div>
            </div>
          </label>
        </div>
      </section>

      <section class="panel">
        <h2>MySQL</h2>
        <div class="grid">
          <label>Host <input id="mysql-host" value="127.0.0.1" /></label>
          <label>Port <input id="mysql-port" type="number" value="3306" /></label>
          <label>Database <input id="mysql-db" placeholder="optional" /></label>
          <label>User <input id="mysql-user" value="root" /></label>
          <label>Password <input id="mysql-pass" type="password" /></label>
          <label>SSL Mode
            <select id="mysql-ssl-mode">
              <option value="DISABLED">DISABLED</option>
              <option value="REQUIRED">REQUIRED</option>
              <option value="VERIFY_CA">VERIFY_CA</option>
              <option value="VERIFY_IDENTITY">VERIFY_IDENTITY</option>
            </select>
          </label>
        </div>
        <div id="ca-cert-row" class="grid hidden" style="margin-top:10px">
          <label>CA Certificate
            <div class="input-with-btn">
              <input id="mysql-ca-cert" placeholder="/path/to/ca-cert.pem" />
              <button type="button" id="mysql-ca-cert-browse" class="browse-btn">Browse...</button>
            </div>
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>SSH Bastion</h2>
          <label class="checkbox"><input id="ssh-enabled" type="checkbox" /> Enable</label>
        </div>
        <div id="ssh-fields" class="grid" style="margin-top:10px">
          <label>Config Host
            <select id="ssh-config-host">
              <option value="">(manual)</option>
            </select>
          </label>
          <label>Host <input id="ssh-host" placeholder="bastion.example.com" /></label>
          <label>Port <input id="ssh-port" type="number" value="22" /></label>
          <label>User <input id="ssh-user" placeholder="ec2-user" /></label>
          <label>IdentityFile
            <div class="input-with-btn">
              <input id="ssh-key" placeholder="~/.ssh/id_ed25519.pub" />
              <button type="button" id="ssh-key-browse" class="browse-btn">Browse...</button>
            </div>
          </label>
        </div>
      </section>
      <div class="actions actions-right">
        <button id="test-btn" class="info">接続テスト</button>
        <button id="connect-btn" class="success">接続</button>
        <button id="profile-save">保存</button>
        <button id="profile-cancel" class="ghost">キャンセル</button>
        <button id="profile-delete" class="danger">削除</button>
      </div>
      <pre id="result" class="log" hidden></pre>
    </main>

    <script src="./settings.js?v=3"></script>
  </body>
</html>
