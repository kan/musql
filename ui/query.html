<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muSQL Query</title>
    <link rel="stylesheet" href="./style.css?v=5" />
    <link rel="stylesheet" href="./lib/codemirror/codemirror.css" />
    <link rel="stylesheet" href="./lib/codemirror/show-hint.css" />
  </head>
  <body>
    <!-- DB selection modal -->
    <div id="db-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h2>Select Database</h2>
        <div id="db-list" class="db-list"></div>
        <p id="db-modal-status" class="modal-status"></p>
      </div>
    </div>

    <!-- Explorer -->
    <div id="explorer" class="explorer hidden">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span id="sidebar-db-name" class="sidebar-db-name"></span>
          <button id="db-switch-btn" class="ghost sidebar-btn" title="DB 切替">&#x21C4;</button>
        </div>
        <div id="table-list" class="table-list"></div>
      </div>

      <!-- Main pane -->
      <div class="main-pane">
        <div class="tab-bar">
          <div id="tab-bar-tabs" class="tab-bar-tabs"></div>
          <button id="tab-add-btn" class="tab-add-btn" title="SQL タブ追加">+</button>
        </div>
        <div id="tab-content" class="tab-content"></div>
      </div>
    </div>

    <!-- Context menu -->
    <div id="context-menu" class="context-menu hidden"></div>

    <script src="./lib/codemirror/codemirror.min.js"></script>
    <script src="./lib/codemirror/sql.min.js"></script>
    <script src="./lib/codemirror/show-hint.min.js"></script>
    <script src="./lib/codemirror/sql-hint.min.js"></script>
    <script src="./query.js?v=5"></script>
  </body>
</html>
