<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muSQL Query</title>
    <link rel="stylesheet" href="./style.css?v=3" />
  </head>
  <body>
    <main>
      <h1>Query</h1>
      <p class="subtitle">Run SQL for selected connection</p>

      <section class="panel split">
        <div class="split-top">
          <h2>Query</h2>
          <textarea id="query">SELECT VERSION();</textarea>
          <div class="actions">
            <button id="run-btn">クエリ実行</button>
          </div>
        </div>
        <div class="split-bottom">
          <h2>Result</h2>
          <pre id="result"></pre>
        </div>
      </section>
    </main>

    <script src="./query.js?v=3"></script>
  </body>
</html>
