<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muSQL Query</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=10" />
    <link rel="stylesheet" href="./lib/codemirror/codemirror.css" />
    <link rel="stylesheet" href="./lib/codemirror/show-hint.css" />
  </head>
  <body>
    <!-- Credential prompt modal -->
    <div id="pw-prompt-modal" class="modal-overlay hidden">
      <div class="modal-box" style="max-width:400px;">
        <div class="modal-heading-row">
          <h2 data-i18n="enter_credentials">Enter Credentials</h2>
          <button type="button" class="help-btn" data-manual="connections.md#パスワードの保存方針" data-i18n-title="help_open_manual">?</button>
        </div>
        <div id="pw-prompt-fields"></div>
        <p id="pw-prompt-error" class="modal-status"></p>
        <div class="actions actions-right" style="margin-top:16px;">
          <button id="pw-prompt-ok" class="success" data-i18n="connect">Connect</button>
          <button id="pw-prompt-cancel" class="ghost" data-i18n="cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- DB selection modal -->
    <div id="db-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-heading-row">
          <h2 id="db-modal-heading">Select Database</h2>
          <button type="button" class="help-btn" data-manual="getting-started.md#接続してクエリを実行する" data-i18n-title="help_open_manual">?</button>
        </div>
        <div id="db-list" class="db-list"></div>
        <p id="db-modal-status" class="modal-status"></p>
      </div>
    </div>

    <!-- AI settings modal -->
    <div id="ai-modal" class="modal-overlay hidden">
      <div class="modal-box" style="max-width:480px;">
        <div class="modal-heading-row">
          <h2 data-i18n="ai_settings">AI Settings</h2>
          <button type="button" class="help-btn" data-manual="ai-assist.md#設定" data-i18n-title="help_open_manual">?</button>
        </div>
        <label><span data-i18n="ai_provider">Provider</span>
          <select id="ai-provider">
            <option value="">-- disabled --</option>
            <option value="claude">Claude (Anthropic)</option>
            <option value="openai">ChatGPT (OpenAI)</option>
            <option value="gemini">Gemini (Google)</option>
          </select>
        </label>
        <label><span data-i18n="ai_model">Model</span>
          <select id="ai-model">
            <option value="">--</option>
          </select>
        </label>
        <label><span data-i18n="ai_api_key">API Key</span>
          <input id="ai-api-key" type="password" />
        </label>
        <div class="actions actions-right">
          <button id="ai-save-btn" data-i18n="save">Save</button>
          <button id="ai-cancel-btn" class="ghost" data-i18n="cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- AI Assist modal -->
    <div id="ai-assist-modal" class="modal-overlay hidden">
      <div class="ai-assist-box">
        <div class="ai-assist-header">
          <h2 data-i18n-html="ai_assist" data-i18n-icon="sparkles" data-i18n-icon-size="18">AI Assist</h2>
          <div class="ai-assist-header-actions">
            <button type="button" class="help-btn" data-manual="ai-assist.md#使い方" data-i18n-title="help_open_manual">?</button>
            <button id="ai-assist-clear-btn" class="ghost sidebar-btn" title="Clear chat"></button>
            <button id="ai-assist-settings-btn" class="ghost sidebar-btn" title="AI Settings"></button>
            <button id="ai-assist-close-btn" class="ghost sidebar-btn"></button>
          </div>
        </div>
        <div id="ai-assist-messages" class="ai-assist-messages"></div>
        <div class="ai-assist-footer">
          <textarea id="ai-assist-input" rows="2" placeholder="Ask AI to write SQL..."></textarea>
          <button id="ai-assist-send-btn"></button>
        </div>
      </div>
    </div>

    <!-- Explorer -->
    <div id="explorer" class="explorer hidden">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span id="sidebar-db-name" class="sidebar-db-name"></span>
          <button id="db-switch-btn" class="ghost sidebar-btn" data-i18n-title="db_switch_title" title="DB 切替"></button>
        </div>
        <div id="table-list" class="table-list"></div>
      </div>

      <!-- Main pane -->
      <div class="main-pane">
        <div class="tab-bar">
          <button id="tab-add-btn" class="tab-add-btn" data-i18n-title="add_sql_tab_title" title="SQL タブ追加"></button>
          <div id="tab-bar-tabs" class="tab-bar-tabs"></div>
          <button id="menu-btn" class="ghost menu-btn sidebar-btn"></button>
        </div>
        <div id="tab-content" class="tab-content"></div>
      </div>
    </div>

    <!-- Context menu -->
    <div id="context-menu" class="context-menu hidden"></div>

    <script src="./lib/codemirror/codemirror.min.js"></script>
    <script src="./lib/codemirror/sql.min.js"></script>
    <script src="./lib/codemirror/show-hint.min.js"></script>
    <script src="./lib/codemirror/sql-hint.min.js"></script>
    <script src="./lib/codemirror/active-line.min.js"></script>
    <script src="./lib/sql-formatter/sql-formatter.min.js"></script>
    <script src="./icons.js"></script>
    <script src="./i18n.js"></script>
    <script src="./theme.js"></script>
    <script src="./manual.js"></script>
    <script src="./query.js?v=16"></script>
  </body>
</html>
